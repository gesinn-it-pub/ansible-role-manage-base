---
- name: Converge
  hosts: all
  vars:
    proxy_env:
      http_proxy: http://proxy.example.test:3128
      https_proxy: http://proxy.example.test:3128
  tasks:
    # Stubbed: geerlingguy.pip and geerlingguy.docker
    # (molecule/shared/roles); the docker CLI, `ip route` and systemctl
    # (molecule/shared/bin).
    # Untested: package installs, a real Docker daemon, systemd and service restarts.
    - name: Run the role with a custom noProxy list
      ansible.builtin.include_role:
        name: ansible-role-manage-base
      vars:
        manage_base_setup_proxy: true
        manage_base_docker_no_proxy: "localhost,127.0.0.0/8,.corp.example.test"
