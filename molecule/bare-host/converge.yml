---
- name: Converge
  hosts: all
  tasks:
    - name: Apply fix-python-externally-managed
      ansible.builtin.include_role:
        name: ansible-role-manage-base
        tasks_from: fix-python-externally-managed.yml

    - name: Apply check-docker-networks (docker absent - graceful skip expected)
      ansible.builtin.include_role:
        name: ansible-role-manage-base
        tasks_from: check-docker-networks.yml

    - name: Apply configure-journald (no systemd - graceful skip expected)
      ansible.builtin.include_role:
        name: ansible-role-manage-base
        tasks_from: configure-journald.yml
