---
# defaults/main.yml

manage_base_docker_network_check: true
manage_base_docker_network_check_mode: fail   # fail | warn

manage_base_setup_proxy: false
manage_base_configure_journald: true

proxy_env: {}
docker_address_pools: []
journald_max_retention: "7day"
journald_system_max_use: "500M"
journald_system_max_file_size: "50M"
