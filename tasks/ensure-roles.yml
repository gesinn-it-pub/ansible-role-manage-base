---
# tasks/ensure-roles.yml

- name: Ensure Base | Ensure roles
  environment: "{{ proxy_env }}"
  block:
    - name: Ensure Base | Install pip
      ansible.builtin.include_role:
        name: geerlingguy.pip

    - name: Ensure Base | Install docker
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_install_compose_plugin: true
        docker_daemon_options: "{{ {'default-address-pools': docker_address_pools} if (docker_address_pools | length) > 0 else {} }}"

    - name: Ensure Base | Install manage_traefik
      ansible.builtin.include_role:
        name: gesinn.manage_traefik
