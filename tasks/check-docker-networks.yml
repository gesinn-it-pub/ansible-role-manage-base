---
# tasks/check-docker-networks.yml

- name: Ensure Base | Check if Docker is installed
  ansible.builtin.command: >
    docker version --format '{% raw %}{{.Server.Version}}{% endraw %}'
  register: docker_version
  changed_when: false
  failed_when: false


- name: Ensure Base | Detect Docker / host subnet overlaps
  ansible.builtin.shell:
    cmd: |
      python3 << 'PYEOF'
      import ipaddress, json, subprocess, sys

      def get_docker_subnets():
          ids = subprocess.check_output(["docker", "network", "ls", "-q"], text=True).split()
          out = subprocess.check_output(["docker", "network", "inspect"] + ids, text=True)
          subnets = []
          for net in json.loads(out):
              for config in (net.get("IPAM", {}).get("Config") or []):
                  s = config.get("Subnet")
                  if s:
                      subnets.append(s)
          return subnets

      def get_host_subnets():
          out = subprocess.check_output(["ip", "route"], text=True)
          subnets = []
          for line in out.splitlines():
              parts = line.split()
              if not parts or "/" not in parts[0]:
                  continue
              dev = parts[parts.index("dev") + 1] if "dev" in parts else ""
              if dev.startswith("docker") or dev.startswith("br-"):
                  continue
              try:
                  ipaddress.ip_network(parts[0], strict=False)
                  subnets.append(parts[0])
              except ValueError:
                  pass
          return subnets

      conflicts = []
      try:
          for d in get_docker_subnets():
              dn = ipaddress.ip_network(d, strict=False)
              for h in get_host_subnets():
                  if dn.overlaps(ipaddress.ip_network(h, strict=False)):
                      conflicts.append(f"Docker: {d} <-> Host: {h}")
      except Exception as e:
          sys.exit(f"ERROR: {e}")

      if conflicts:
          print("\n".join(conflicts))
      PYEOF
    executable: /bin/bash
  register: docker_network_conflicts
  changed_when: false
  when: docker_version.rc == 0


- name: Ensure Base | Assert no Docker network conflicts are present
  ansible.builtin.assert:
    that:
      - docker_network_conflicts.stdout | trim == ""
    fail_msg: >
      Docker network conflict detected:
      {{ docker_network_conflicts.stdout }}
  when:
    - docker_version.rc == 0
    - manage_base_docker_network_check_mode | default('fail') == 'fail'


- name: Ensure Base | Warn about Docker network conflicts
  ansible.builtin.debug:
    msg: >
      WARNING: Docker network conflict detected:
      {{ docker_network_conflicts.stdout }}
  when:
    - docker_version.rc == 0
    - docker_network_conflicts.stdout | trim != ""
    - manage_base_docker_network_check_mode | default('fail') == 'warn'
